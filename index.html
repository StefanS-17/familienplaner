];

/* ---------- Aktionen ---------- */
const A = {
  go(v){ S.view = v; saveUi(); closeModal(); render(); window.scrollTo(0,0); },
  more(){
    const pc = isParent() ? pendingCount() : 0;
    const items = navItems().filter(n => !['heute','kalender','aufgaben','essen','schule'].includes(n.id));
    openModal(`<h2>Mehr</h2><div class="sheet-list">${items.map(n => `<button onclick="A.go('${n.id}')">${ic(n.icon)} ${n.label}${n.id==='freigaben'&&pc?`<span class="badge">${pc}</span>`:''}</button>`).join('')}<button onclick="A.settings()">${ic('brush')} Meine Einstellungen</button><button onclick="A.close();A.logout()">${ic('swap')} Person wechseln</button></div>`);
  },
  meMenu(){ openModal(`<div class="row" style="margin-bottom:10px">${avatar(S.me)}<h2 style="margin:0">${esc(S.me.name)}</h2></div><div class="sheet-list"><button onclick="A.settings()">${ic('brush')} Meine Einstellungen</button><button onclick="A.close();A.logout()">${ic('swap')} Person wechseln</button></div>`); },
  close: closeModal,
  yes(){ const f = FORM.onYes; closeModal(); f(); },
  submitForm(e){ e.preventDefault(); const v = readForm(); if (!v) return; const f = FORM.onSave; closeModal(); f(v); },
  sub(view, tab){ S.sub[view] = tab; render(); },
  openPinnwand(){ S.sub.aufgaben = 'pinnwand'; A.go('aufgaben'); },
  day(n){ S.dayOffset = n; render(); },
  filter(id){ S.filter.has(id) ? S.filter.delete(id) : S.filter.add(id); if (!S.filter.size) members().forEach(m => S.filter.add(m.id)); saveUi(); render(); },
  filterAll(){ members().forEach(m => S.filter.add(m.id)); saveUi(); render(); },

  /* Login */
  async setupSave(e){
    e.preventDefault();
    const ms = members(), upd = [];
    for (const m of ms){ const v = document.getElementById('pin-' + m.id).value; if (!/^\d{4}$/.test(v)){ toast(`PIN für ${m.name} muss 4 Ziffern haben`, true); return; } const name = document.getElementById('name-' + m.id).value.trim() || m.name; upd.push({ ...m, name, pinHash: await hashPin(m.id, v) }); }
    await Store.saveMany(upd); S.screen = 'login'; render(); toast('PINs gespeichert');
  },
  pick(id){ S.loginFor = id; S.pinEntry = ''; render(); },
  pinBack(){ S.loginFor = null; S.pinEntry = ''; render(); },
  pinDel(){ S.pinEntry = S.pinEntry.slice(0,-1); render(); },
  async pin(d){
    if (S.pinEntry.length >= 4) return;
    S.pinEntry += d; render();
    if (S.pinEntry.length === 4){
      const m = mem(S.loginFor), h = await hashPin(m.id, S.pinEntry);
      if (h === m.pinHash){ S.me = m; S.loginFor = null; S.pinEntry = ''; localStorage.setItem(LS_ME, m.id); S.screen = 'app'; S.dayOffset = 0; render(); }
      else { S.pinEntry = ''; render(); const el = document.getElementById('dots'); el?.classList.add('shake'); toast('Falsche PIN', true); }
    }
  },
  logout(){ S.me = null; localStorage.removeItem(LS_ME); S.screen = 'login'; S.loginFor = null; render(); },

  /* Freigaben */
  approve(id){ const it = find(id); if (!it) return; if (it.type === 'reward' && it.status === 'pending') return A.editReward(id); Store.save({ ...it, status:'ok', approvedBy:S.me.id }); },
  reject(id){ const it = find(id); confirmBox(`Vorschlag von ${esc(mem(it?.createdBy)?.name||'')} ablehnen? Der Eintrag wird entfernt.`, () => Store.remove(id), 'Ablehnen'); },
  approveAll(){
    const ps = S.items.filter(i => i.status === 'pending'), skip = ps.filter(i => i.type === 'reward');
    Store.saveMany(ps.filter(i => i.type !== 'reward').map(i => ({ ...i, status:'ok', approvedBy:S.me.id }))).then(render);
    if (skip.length) toast('Belohnungswünsche bitte einzeln bestätigen – dabei den Preis festlegen');
  },
  del(id){ confirmBox('Dieser Eintrag wird gelöscht.', () => Store.remove(id)); },

  /* Kalender */
  calMode(m){ S.cal.mode = m; render(); },
  calNav(n){ const d = parse(S.cal.date); if (S.cal.mode === 'woche') S.cal.date = ymd(addDays(d, 7*n)); else { const x = new Date(d.getFullYear(), d.getMonth()+n, 1); S.cal.date = ymd(x); S.cal.sel = ymd(x); } render(); },
  calToday(){ S.cal.date = S.cal.sel = todayStr(); render(); },
  calSel(ds){ S.cal.sel = ds; render(); },
  quickAdd(){ openModal(`<h2>Neu anlegen</h2><div class="sheet-list"><button onclick="A.newEvent()">${ic('cal')} Termin</button><button onclick="A.newTask()">${ic('check')} Aufgabe</button><button onclick="A.close();A.go('essen')">${ic('cart')} Einkauf</button><button onclick="A.newNote()">${ic('note')} Pinnwand-Eintrag</button><button onclick="A.editExam()"><span style="font-size:20px;width:22px;text-align:center">📝</span> Prüfung</button></div>`); },
  newEvent(date, category){ A.editEvent(null, date, category); },
  editEvent(id, date, category){
    const e = id ? find(id) : null;
    if (e?.category === 'pruefung' || category === 'pruefung') return A.editExam(id, date);
    const cat = category || 'termin';
    const values = e || { date: date || (S.view==='kalender' ? S.cal.sel : todayStr()), category: cat, persons: S.me.role==='child' ? [S.me.id] : [], repeat: cat==='training' ? 'weekly' : 'none', skipHolidays: cat==='training', start:'', end:'' };
    openForm({ title: e ? 'Termin bearbeiten' : (CATS[cat] === 'Termin' ? 'Neuer Termin' : CATS[cat] + ' anlegen'), fields: EVENT_FIELDS(), values,
      onSave: v => {
        if (v.repeat !== 'weekly'){ v.until = ''; }
        Store.save(e ? { ...e, ...v } : make('event', v));
        toast(isParent() || e ? 'Gespeichert' : 'Als Vorschlag gespeichert – wartet auf Freigabe');
      } });
  },
  showEvent(id, ds){
    const e = find(id) || G.index[id]; if (!e) return;
    const isG = e.type === 'gevent';
    const row = (k,v) => v ? `<div class="detail-row"><span class="k">${k}</span><span class="v">${v}</span></div>` : '';
    const people = (e.persons && e.persons.length ? e.persons : []).map(p => mem(p)).filter(Boolean);
    let actions = '';
    if (e.status === 'pending' && isParent()) actions += `<button class="btn ok" onclick="A.close();A.approve('${id}')">Bestätigen</button><button class="btn danger" onclick="A.close();A.reject('${id}')">Ablehnen</button>`;
    if (isParent() && !isG){
      actions += `<button class="btn sec" onclick="A.editEvent('${id}')">${ic('edit','sm')} Bearbeiten</button>`;
      if (e.repeat === 'weekly') actions += `<button class="btn sec" onclick="A.skipOne('${id}','${ds}')">Nur am ${fmtShort(ds)} absagen</button>`;
      actions += `<button class="btn danger" onclick="A.del('${id}')">${ic('trash','sm')} ${e.repeat==='weekly'?'Ganze Serie löschen':'Löschen'}</button>`;
    }
    openModal(`<div class="row" style="margin-bottom:6px"><span class="tag">${CAT_ICON[e.category]||''} ${CATS[e.category]||'Termin'}</span>${pendTag(e)}</div><h2>${esc(e.title)}</h2>
      ${row('Wann', fmtLong(ds) + ' · ' + timeLabel(e))}${row('Wiederholung', e.repeat==='weekly' ? `jeden ${WDL[wdIdx(parse(e.date))]}${e.until?' bis '+fmtDate(e.until):''}${e.skipHolidays?' · pausiert in den Ferien':''}` : '')}
      ${e.category === 'pruefung' ? row('Prüfung', `${esc(e.examType || '')} · ${esc(e.subject || '')}`) + row('Countdown', countdown(e.date)) + row('Stoff', esc(e.topic)) + row('Lernen', +e.learnDays ? `ab ${e.learnDays} Tage vorher täglich „Für ${esc(e.subject)} lernen“` : '') : ''}
      ${row('Wer', people.length ? people.map(p => avatar(p,'xs') + ' ' + esc(p.name)).join('&nbsp;&nbsp;') : 'Ganze Familie')}${row('Ort', esc(e.location))}${row('Mitbringen', esc(e.bring))}${row('Notiz', esc(e.note))}
      ${row('Eingetragen', esc(mem(e.createdBy)?.name || ''))}${isG ? row('Quelle', `📆 ${esc(e.source)} – ändern bitte direkt in Google Kalender`) : ''}
      <div class="actions">${actions}<button class="btn sec" onclick="A.close()">Schließen</button></div>`);
  },
  editExam(id, date, preset){
    const e = id ? find(id) : null;
    if (e && !isParent()) return A.showEvent(id, e.date);
    const subjects = [...new Set(all('timetable').flatMap(tt => Object.values(tt.cells || {}).map(c => c.fach)).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'de'));
    const def = S.me.role === 'child' ? [S.me.id] : (S.view === 'schule' && S.ttKid ? [S.ttKid] : kids().length === 1 ? [kids()[0].id] : []);
    openForm({ title: e ? 'Prüfung bearbeiten' : 'Neue Prüfung', fields:[
      { k:'persons', label:'Wer schreibt?', type:'persons', members:kids },
      [{ k:'examType', label:'Art', type:'select', options:EXAM_TYPES }, { k:'subject', label:'Fach', required:true, ph:'z. B. Mathe', suggest:subjects }],
      [{ k:'date', label:'Datum', type:'date', required:true }, { k:'start', label:'Uhrzeit (optional)', type:'time' }],
      { k:'topic', label:'Stoff / Thema', type:'textarea', ph:'z. B. Bruchrechnen, Buch S. 40–52' },
      { k:'learnDays', label:'Lern-Erinnerung', type:'select', options:[['0','Keine'],['3','ab 3 Tage vorher'],['5','ab 5 Tage vorher'],['7','ab 7 Tage vorher'],['10','ab 10 Tage vorher'],['14','ab 14 Tage vorher']],
        hint:'In diesen Tagen steht beim Kind täglich „Für … lernen“ zum Abhaken.' }],
      values: preset || (e ? { ...e, learnDays:String(e.learnDays ?? 0) } : { persons:def, examType:'Schulaufgabe', date: date || todayStr(), learnDays:'7' }),
      onSave: v => {
        if (!v.persons.length){ toast('Bitte auswählen, wer die Prüfung schreibt', true); return A.editExam(id, date, v); }
        const data = { ...v, learnDays: +v.learnDays || 0, title:`${v.subject}-${v.examType}`, category:'pruefung', allDay:!v.start, end:'', repeat:'none' };
        Store.save(e ? { ...e, ...data } : make('event', { ...data, learnDone:{} }));
        toast(isParent() || e ? 'Prüfung gespeichert' : 'Als Vorschlag gespeichert – wartet auf Freigabe');
      },
      extra: e ? `<button type="button" class="btn danger" style="width:100%;margin-top:10px" onclick="A.close();A.del('${e.id}')">${ic('trash','sm')} Prüfung löschen</button>` : '' });
  },
  toggleLearn(examId, personId, ds){
    const e = find(examId); if (!e || !(isParent() || personId === S.me.id)) return;
    const ld = { ...(e.learnDone || {}) }, keys = new Set(ld[personId] || []);
    const on = !keys.has(ds);
    on ? keys.add(ds) : keys.delete(ds);
    ld[personId] = [...keys];
    Store.save({ ...e, learnDone:ld });
    if (ok(e)) bookStars(`star-learn-${e.id}-${personId}-${ds}`, personId, themeStars('schule'), `Für ${e.subject || e.title} lernen`, themeById('schule').icon, on);
  },
  skipOne(id, ds){ const e = find(id); closeModal(); Store.save({ ...e, exceptions: [...(e.exceptions||[]), ds] }); toast(`Termin am ${fmtShort(ds)} abgesagt`); },

  /* Aufgaben */
  newTask(recurring){ A.editTask(null, recurring); },
  editTask(id, recurring){
    const t = id ? find(id) : null;
    openForm({ title: t ? 'Aufgabe bearbeiten' : recurring ? 'Neues Ämtli' : 'Neue Aufgabe',
      fields: [
        { k:'title', label:'Was ist zu tun?', required:true, ph: recurring ? 'z. B. Spülmaschine ausräumen' : 'z. B. Turnbeutel packen' },
        { k:'person', label:'Wer?', type:'select', options:[['','Alle / niemand Bestimmtes'], ...members().map(m => [m.id, m.name])] },
        [{ k:'repeat', label:'Wiederholung', type:'select', options:Object.entries(REPEAT) }, { k:'due', label:'Fällig am (einmalig)', type:'date' }],
        isParent()

    const stat = (k, v) => `<div class="wx-stat">${k}<b>${v}</b></div>`;
    openModal(`<div id="wx-pop"><h2 style="margin-bottom:4px">🌤️ Wetter in ${esc(loc.name)}</h2><div class="muted small">Aktualisiert ${relTime(new Date(d.at).toISOString())}</div>
      <div class="chips" style="margin-top:12px">${dl.time.map((x, k) => `<button class="chip plain ${k === i ? 'on' : ''}" onclick="A.weather(${k})">${dayName(k)} ${wxIcon(dl.weather_code[k])} ${deg(dl.temperature_2m_max[k])}</button>`).join('')}</div>
      <div class="wx-head"><span class="wx-ic">${i === 0 ? wxIcon(d.current.weather_code, d.current.is_day) : wxIcon(dl.weather_code[i])}</span><div>

      <div class="wx-stats">${stat('Höchst / Tiefst', `${deg(dl.temperature_2m_max[i])} / ${deg(dl.temperature_2m_min[i])}`)}${stat('Regenrisiko', (dl.precipitation_probability_max[i] ?? 0) + ' %')}${stat('Regenmenge', String(dl.precipitation_sum[i] ?? 0).replace('.', ',') + ' mm')}${stat('Wind bis', Math.round(dl.wind_speed_10m_max[i]) + ' km/h')}${stat('Sonne', `🌅 ${dl.sunrise[i].slice(11)} · 🌇 ${dl.sunset[i].slice(11)}`)}${stat('UV-Index', Math.round(dl.uv_index_max[i] ?? 0))}</div>

    const custom = p.bg && !COLORS.includes(p.bg);
    openModal(`<div id="settings"><div class="row" style="margin-bottom:6px">${avatar(m)}<h2 style="margin:0">Meine Einstellungen</h2></div>
      <p class="muted small" style="margin-top:4px">Gilt nur für dich – auf jedem Gerät, auf dem du dich anmeldest.</p>
      <div class="sec-t">Meine Farbe</div><div class="colors">${COLORS.map(c => `<button class="${c === m.color ? 'on' : ''}" style="--c:${c}" onclick="A.setPref('color','${c}')" aria-label="Farbe wählen"></button>`).join('')}</div>
      <div class="sec-t" style="margin-top:18px">Hintergrund</div><div class="colors"><button class="none ${!p.bg ? 'on' : ''}" onclick="A.setPref('bg','')" title="Standard" aria-label="Standard-Hintergrund">–</button>${COLORS.map(c => `<button class="${c === p.bg ? 'on' : ''}" style="--c:${c}" onclick="A.setPref('bg','${c}')" aria-label="Hintergrundfarbe wählen"></button>`).join('')}<label class="custom ${custom ? 'on' : ''}" title="Eigene Farbe"><input type="color" value="${custom ? p.bg : '#2563eb'}" onchange="A.setPref('bg',this.value)" aria-label="Eigene Hintergrundfarbe"></label></div>
      <div class="sec-t" style="margin-top:18px">Darstellung</div><div class="seg">${[['auto','Automatisch'],['light','Hell'],['dark','Dunkel']].map(([k,l]) => `<button class="${(p.theme || 'auto') === k ? 'on' : ''}" onclick="A.setPref('theme','${k}')">${l}</button>`).join('')}</div>
      <div class="actions"><button class="btn" onclick="A.close()">Fertig</button></div></div>`);
    const md = document.querySelector('#modal .modal'); if (md) md.scrollTop = old;
  },
  setPref(k, v){
    const m = { ...S.me };
    if (k === 'color') m.color = v; else m.prefs = { ...(m.prefs || {}), [k]: v };
    Store.save(m); A.settings();
  },
  editGcal(id){
    if (!isAdmin()) return;
    const g = id ? find(id) : null;
    openForm({ title: g ? 'Google Kalender bearbeiten' : 'Google Kalender verknüpfen', fields:[
      { k:'label', label:'Bezeichnung', required:true, ph:'z. B. Familienkalender' },
      { k:'url', label:'Geheime Adresse im iCal-Format', required:true, ph:'https://calendar.google.com/calendar/ical/…/basic.ics',
        hint:'Am Computer in Google Kalender: ⚙️ Einstellungen → links den Kalender anklicken → „Kalender integrieren“ → <b>Geheime Adresse im iCal-Format</b> kopieren.' },
      { k:'matchNames', label:'Personen anhand des Namens im Termintitel erkennen', type:'checkbox' },
      { k:'persons', label:'Termine ohne erkannten Namen gehören zu', type:'persons', hint:'Keine Auswahl = Ganze Familie' }],
      values: g || { label:'Familienkalender', matchNames:true, persons:[] },
      onSave: v => {
        if (!/^https:\/\/calendar\.google\.com\/calendar\/ical\//.test(v.url)){ toast('Bitte die „Geheime Adresse im iCal-Format“ aus Google Kalender einfügen', true); return; }
        Store.save(g ? { ...g, ...v } : { id:'gcal-' + uid(), type:'gcal', ...v, status:'ok', createdBy:S.me.id, createdAt:new Date().toISOString() }).then(() => syncGoogle(true));
        toast(g ? 'Gespeichert' : 'Kalender verknüpft – Termine werden geladen');
      },
      extra: g ? `<button type="button" class="btn danger" style="width:100%;margin-top:10px" onclick="A.delGcal('${g.id}')">${ic('trash','sm')} Verknüpfung entfernen</button>` : '' });
  },
  delGcal(id){ if (!isAdmin()) return; confirmBox('Verknüpfung mit diesem Google Kalender entfernen? Die Termine verschwinden aus der App, in Google bleiben sie erhalten.', () => Store.remove(id).then(() => syncGoogle()), 'Entfernen'); },
  syncG(){ syncGoogle(true); toast('Wird aktualisiert…'); },

  /* Verwaltung */
  editMember(id){
    if (!isAdmin()) return;
    const m = id ? find(id) : null;
    openForm({ title: m ? `${m.name} bearbeiten` : 'Neue Person', fields:[
      { k:'name', label:'Name', required:true },
      { k:'role', label:'Rolle', type:'select', options:[['parent','Elternteil – darf alles'],['child','Kind – Einträge sind Vorschläge']] },
      { k:'color', label:'Farbe', type:'color' },
      { k:'admin', label:'Admin (verwaltet Personen & Rechte)', type:'checkbox' },
      { k:'pin', label: m ? 'Neue PIN (leer lassen = unverändert)' : 'PIN (4 Ziffern)', type:'password', attrs:'inputmode="numeric" maxlength="4" autocomplete="new-password"', required: !m }],
      values: m ? { ...m, pin:'' } : { role:'child', color: COLORS.find(c => !members().some(x => x.color === c)) || COLORS[0] },
      onSave: async v => {
        if (v.pin && !/^\d{4}$/.test(v.pin)){ toast('Die PIN muss genau 4 Ziffern haben', true); return; }
        if (m && m.id === S.me.id && !v.admin){ toast('Du kannst dir die Admin-Rechte nicht selbst entziehen', true); return; }
        const base = m ? { ...m } : { id:'member-' + uid(), type:'member', order: members().length, status:'ok', createdAt:new Date().toISOString() };
        const pin = v.pin; delete v.pin;
        Object.assign(base, v);
        if (pin) base.pinHash = await hashPin(base.id, pin);
        if (!m) S.filter.add(base.id);
        await Store.save(base); toast('Gespeichert');
      },
      extra: m && m.id !== S.me.id ? `<button type="button" class="btn danger" style="width:100%;margin-top:10px" onclick="A.delMember('${m.id}')">${ic('trash','sm')} Person entfernen</button>` : '' });
  },
  delMember(id){ const m = find(id); confirmBox(`${esc(m.name)} entfernen? Bereits eingetragene Termine und Aufgaben bleiben erhalten.`, () => Store.remove(id), 'Entfernen'); },
  cloudSetup(){
    openForm({ title:'Mit Cloud verbinden', fields:[
      { k:'url', label:'Supabase Project URL', required:true, ph:'https://xxxx.supabase.co' },
      { k:'key', label:'Supabase anon / public key', required:true, type:'textarea', hint:'Beides findest du in Supabase unter Project Settings → API. Siehe EINRICHTUNG.md.' }],
      onSave: v => { localStorage.setItem(LS_CLOUD, JSON.stringify({ url:v.url.replace(/\/$/,''), key:v.key })); location.reload(); } });
  },
  async cloudLogin(e){
    e.preventDefault(); const f = e.target;
    const { error } = await Store.sb.auth.signInWithPassword({ email: f.email.value.trim(), password: f.pw.value });
    if (error){ toast('Anmeldung fehlgeschlagen: ' + error.message, true); return; }
    try { await Store.loadCloud(); await afterLoad(); } catch(err){ toast('Fehler: ' + err.message, true); }
  },
  cloudLogout(){ confirmBox('Dieses Gerät vom Familienkonto abmelden? Danach muss das Familienkonto-Passwort erneut eingegeben werden.', async () => { await Store.sb.auth.signOut(); localStorage.removeItem(LS_ME); location.reload(); }, 'Abmelden'); },
  cloudDisconnect(){ localStorage.removeItem(LS_CLOUD); location.reload(); },
  exportData(){
    const blob = new Blob([JSON.stringify({ app:'familienplaner', exportiert:new Date().toISOString(), items:S.items }, null, 2)], { type:'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `familienplaner-sicherung-${todayStr()}.json`; a.click(); URL.revokeObjectURL(a.href);
  },
  importData(input){
    const file = input.files[0]; if (!file) return;
    file.text().then(t => {
      let d; try { d = JSON.parse(t); } catch { toast('Datei ist keine gültige Sicherung', true); return; }
      if (!Array.isArray(d.items)){ toast('Datei ist keine gültige Sicherung', true); return; }
      confirmBox(`Alle aktuellen Daten durch die Sicherung (${d.items.length} Einträge) ersetzen?`, async () => { await Store.replaceAll(d.items); refreshMe(); render(); toast('Sicherung eingespielt'); }, 'Ersetzen');
    });
    input.value = '';
  }
};

Store.init();
</script>
</body>
</html>
